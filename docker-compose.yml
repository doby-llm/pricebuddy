services:

    app:
        build:
            context: .
            dockerfile: docker/php.dockerfile
        image: pi/pricebuddy-app:${PI_TAG:-209acae0bcd0}
        pull_policy: never
        restart: unless-stopped
        ports:
            - 8080:80
        volumes:
            - storage:/app/storage
            - ./.env:/app/.env
        environment:
            DB_HOST: database                       # Name of the database service
            DB_USERNAME: pricebuddy                 # Should match the MYSQL_USER in the database service
            DB_PASSWORD: pric3buddy                 # Should match the MYSQL_PASSWORD in the database service
            DB_DATABASE: pricebuddy                 # Should match the MYSQL_DATABASE in the database service
            APP_USER_EMAIL: admin@example.com       # Only used for seeding the database
            APP_USER_PASSWORD: admin                # Only used for seeding the database
            SCRAPER_BASE_URL: http://scraper:3000   # Url to Name of the scrapper service
            AFFILIATE_ENABLED: 'true'               # See https://pricebuddy.jez.me/support-project.html
        depends_on:
            database:
                condition: service_healthy
            scraper:
                condition: service_healthy
        healthcheck:
            test: [ "CMD-SHELL", "php -r 'exit(@file_get_contents(\"http://127.0.0.1/up\") === false ? 1 : 0);'" ]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 60s
        networks:
            - default

    database:
        build:
            context: .
            dockerfile: docker/database.dockerfile
        image: pi/pricebuddy-database:${PI_TAG:-209acae0bcd0}
        pull_policy: never
        restart: unless-stopped
        environment:
            MYSQL_DATABASE: pricebuddy
            MYSQL_USER: pricebuddy
            MYSQL_PASSWORD: pric3buddy
            MYSQL_ROOT_PASSWORD: root
        volumes:
            - database:/var/lib/mysql
        networks:
            - default
        healthcheck:
            test: [ "CMD-SHELL", "MYSQL_PWD=\"$${MYSQL_PASSWORD}\" mysqladmin ping -h localhost -u\"$${MYSQL_USER}\" --silent" ]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 1m

    scraper:
        build:
            context: .
            dockerfile: docker/scraper.dockerfile
        image: pi/pricebuddy-scraper:${PI_TAG:-209acae0bcd0}
        pull_policy: never
        restart: unless-stopped
        networks:
            - default
        ports:
            - 3030:3000 # Optional, if you want to access the scrapper api from the host machine
        healthcheck:
            test: [ "CMD-SHELL", "python3 -c 'import sys, urllib.request; urllib.request.urlopen(\"http://127.0.0.1:3000/health\", timeout=3).close()'"]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 30s

volumes:
    storage:
    database:

networks:
    default:
